<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="wtitle wdesc">
  <title id="wtitle">Consult flow</title>
  <desc id="wdesc">Five-step consult: free discovery, lowest tier, unpaid 402 probe, human approval, wisdom envelope. Stop if the user declines or the host is down.</desc>
  <rect width="1200" height="220" rx="18" fill="#0b0c0e"/>
  <rect x="1" y="1" width="1198" height="218" rx="17" fill="none" stroke="#2a2e33"/>

  <!-- connectors -->
  <path d="M236 110 H276" stroke="#e6a317" stroke-width="2"/>
  <path d="M456 110 H496" stroke="#e6a317" stroke-width="2"/>
  <path d="M676 110 H716" stroke="#e6a317" stroke-width="2"/>
  <path d="M896 110 H936" stroke="#e6a317" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(24 36)">
      <rect width="212" height="148" rx="10" fill="#14171c" stroke="#2a2e33"/>
      <text x="18" y="36" fill="#e6a317" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">01</text>
      <text x="18" y="74" fill="#e7e2d6" font-size="22" font-weight="600">Discover free</text>
      <text x="18" y="106" fill="#8a9086" font-size="18">GET /api/health</text>
      <text x="18" y="132" fill="#8a9086" font-size="18">GET /api/pricing</text>
    </g>
    <g transform="translate(284 36)">
      <rect width="172" height="148" rx="10" fill="#14171c" stroke="#2a2e33"/>
      <text x="18" y="36" fill="#e6a317" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">02</text>
      <text x="18" y="74" fill="#e7e2d6" font-size="22" font-weight="600">Lowest tier</text>
      <text x="18" y="106" fill="#8a9086" font-size="18">Match the</text>
      <text x="18" y="132" fill="#8a9086" font-size="18">question. No upsell.</text>
    </g>
    <g transform="translate(516 36)">
      <rect width="160" height="148" rx="10" fill="#14171c" stroke="#2a2e33"/>
      <text x="18" y="36" fill="#e6a317" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">03</text>
      <text x="18" y="74" fill="#e7e2d6" font-size="22" font-weight="600">Probe 402</text>
      <text x="18" y="106" fill="#8a9086" font-size="18">Unpaid POST.</text>
      <text x="18" y="132" fill="#8a9086" font-size="18">Stop. Explain.</text>
    </g>
    <g transform="translate(736 36)">
      <rect width="160" height="148" rx="10" fill="#14171c" stroke="#e6a317"/>
      <text x="18" y="36" fill="#e6a317" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">04</text>
      <text x="18" y="74" fill="#e7e2d6" font-size="22" font-weight="600">Human yes</text>
      <text x="18" y="106" fill="#8a9086" font-size="18">This amount.</text>
      <text x="18" y="132" fill="#8a9086" font-size="18">This turn only.</text>
    </g>
    <g transform="translate(956 36)">
      <rect width="220" height="148" rx="10" fill="#14171c" stroke="#2a2e33"/>
      <text x="18" y="36" fill="#e6a317" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">05</text>
      <text x="18" y="74" fill="#e7e2d6" font-size="22" font-weight="600">Envelope</text>
      <text x="18" y="106" fill="#8a9086" font-size="18">verdict · wisdom</text>
      <text x="18" y="132" fill="#8a9086" font-size="18">risk · receipt</text>
    </g>
  </g>
</svg>
